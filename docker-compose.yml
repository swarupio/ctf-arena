# Starter compose file. Swarup creates it (Phase 1), Shubham finishes it (Phase 3).
services:
  backend:
    build: ./backend
    env_file: .env
    expose:
      - "4000"
    volumes:
      # Lets the backend start challenge containers. See docs/SECURITY.md.
      - /var/run/docker.sock:/var/run/docker.sock
    # The backend runs as the non-root 'node' user; it needs the docker socket's group
    # to start challenge containers. Linux/EC2: DOCKER_GID=$(getent group docker | cut -d: -f3).
    group_add:
      - "${DOCKER_GID:-0}"
    deploy:
      replicas: 3            # Phase 3: scale with `docker compose up --scale backend=5`
    networks:
      - ctf-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - ctf-net
    restart: unless-stopped

networks:
  ctf-net:
  # Challenge containers join the separate "ctf-challenges" network.
  # The backend creates it on startup if it does not exist.
