# Mini CTF Arena - Nginx front door (P3-06).
#
# Does three jobs:
#   1. serves the built React app from /usr/share/nginx/html (compose mounts frontend/dist there),
#      with a single-page-app fallback to index.html;
#   2. load-balances /api/* across all backend replicas;
#   3. rate-limits and compresses.
#
# Validate without starting the stack:
#   docker run --rm -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t

user nginx;
worker_processes auto;
# /tmp is a tmpfs in docker-compose.yml (read-only root filesystem).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  # API bodies are tiny JSON (the backend itself caps them at 100 kb). Nobody uploads files here.
  client_max_body_size 128k;

  # The backend sets X-Served-By to its container hostname; the footer in the UI shows it.
  # It is also logged here as served_by=. Never add proxy_hide_header for it.
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time upstream=$upstream_addr served_by=$upstream_http_x_served_by';
  access_log /dev/stdout main buffer=16k flush=1s;

  # ---- compression -------------------------------------------------------------------------
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript application/javascript
             application/json application/xml image/svg+xml;

  # ---- rate limiting -----------------------------------------------------------------------
  # Per client IP, API only. Normal use is well below 1 request per second per player
  # (leaderboard poll every 10 s plus clicks), so 30 r/s with a burst of 100 never throttles
  # real users, but stops scripted floods.
  # NAT / classroom case: every player behind one public address shares ONE bucket. At about 1 request
  # per second per player the sustained rate admits roughly 30 players per address (the load test,
  # docs/LOADTEST.md, estimated 20 to 25 at the old 20 r/s). The burst of 100 absorbs the page-load spike
  # when a whole room opens the site at once. These are fixed constants on purpose (no env variables: Nginx
  # does not read them); for a bigger single-address crowd edit rate= and burst= here and restart Nginx.
  # Flood cost is bounded: one address at 30 r/s is a small share of the measured capacity.
  # Flag brute-forcing is limited separately by the backend (5 per minute per team per challenge).
  #
  # Trusted local sources are exempt so that load tests run from the host or a laptop measure the
  # replicas, not this limiter. Real internet clients always arrive with a public address.
  # If you put a TLS proxy (Caddy, Certbot) in front of this container, every request will look
  # local, so also enable the real_ip lines in the server block below. See docs/SECURITY.md.
  geo $rate_limit_exempt {
    default       0;
    127.0.0.0/8   1;
    ::1           1;
    172.16.0.0/12 1;   # Docker bridge networks (host-to-container traffic appears from here)
  }
  map $rate_limit_exempt $api_limit_key {
    0 $binary_remote_addr;
    1 "";                 # an empty key is not counted
  }
  limit_req_zone $api_limit_key zone=api_per_ip:10m rate=30r/s;
  limit_req_status 429;
  limit_req_log_level warn;

  # ---- micro-cache for the two public polled endpoints (GET /api/event, GET /api/announcement) --
  # Both answer the same body to everybody (no auth, no per-user data), so one cached copy per Nginx
  # is correct and removes the MongoDB read for most polls. Entries live 2 s, so a schedule, freeze or
  # announcement change shows up at most 2 s late (the API already allowed 3 s via max-age=3).
  # /var/cache/nginx is a tmpfs in docker-compose.yml. Nothing else is ever cached.
  proxy_cache_path /var/cache/nginx/public_api levels=1 keys_zone=public_api:1m max_size=4m inactive=10s use_temp_path=off;
  server {
    listen 80 default_server;
    server_name _;

    # Docker's embedded DNS. Because proxy_pass below uses a variable, Nginx re-resolves "backend"
    # at request time (cached for 10 s) and gets one A record per replica. That is what makes
    # `docker compose up -d --scale backend=5` work without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Uncomment when a TLS proxy runs in front of Nginx (see docs/SECURITY.md, HTTPS section):
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;

    # Liveness probe for Docker's healthcheck (does not touch the backend).
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ---- API: round-robin over the backend replicas ----------------------------------------
    location /api/ {
      limit_req zone=api_per_ip burst=100 nodelay;
      error_page 429 = @rate_limited;

      set $backend_upstream http://backend:4000;
      proxy_pass $backend_upstream;          # variable without a URI: the request path is passed unchanged

      proxy_http_version 1.1;
      proxy_set_header Connection close;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # We are the edge: overwrite, never append a client-supplied chain (it could be forged).
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      # A local replica accepts a connection in milliseconds. A killed container's address does not
      # refuse, it just never answers, so this value is how long a request stalls on a dead replica
      # (it was 5 s, measured in docs/LOADTEST.md section 4.5).
      proxy_connect_timeout 1s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      # If a replica is down or restarting, try another one. non_idempotent is deliberately NOT listed,
      # so once a POST/PATCH/DELETE has been SENT to a replica it is never retried: a flag submission
      # cannot be replayed by Nginx. (A failed CONNECT means nothing was sent, so Nginx may still move
      # any method to the next replica in that case; measured below in docs/LOADTEST.md.)
      # GET/HEAD are retried once. The timeout caps the total time spent on retries.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 3s;

      # No add_header here on purpose: Helmet already sets security headers on API responses,
      # and X-Served-By passes through untouched.
    }

    # ---- public polled endpoints: 2 s micro-cache ---------------------------------------------
    # Exact matches, so they win over /api/ above. Same proxy settings as /api/ (nginx does not inherit
    # them into a different location). Rate limiting still applies before the cache. Only GET/HEAD are
    # cacheable (the default proxy_cache_methods); a POST here is proxied normally.
    location ~ ^/api/(event|announcement)/?$ {
      limit_req zone=api_per_ip burst=100 nodelay;
      error_page 429 = @rate_limited;

      set $backend_upstream http://backend:4000;
      proxy_pass $backend_upstream;

      proxy_http_version 1.1;
      proxy_set_header Connection close;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization "";     # public data: never forward a player's token for a shared cache entry

      proxy_connect_timeout 1s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 3s;

      proxy_cache public_api;
      # The query string is ignored by both routes, so leave it out of the key (no cache-busting with ?x=...).
      proxy_cache_key "$request_method$uri";
      # The backend sends Cache-Control: no-store on /api/announcement and max-age=3 on /api/event;
      # the fixed 2 s below decides instead. Only successful answers are stored, never errors.
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_cache_valid 200 2s;
      proxy_cache_lock on;                   # one request refreshes an expired entry, the rest wait for it
      proxy_cache_lock_timeout 3s;
      # Only "updating": never serve an expired entry because the backend failed (that could hide a freeze
      # or schedule change for as long as the outage lasts).
      proxy_cache_use_stale updating;
      add_header X-Cache-Status $upstream_cache_status;
      # X-Served-By in the response is the replica that filled the entry, which is still a real replica name.
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Slow down and try again."}}';
    }

    # ---- built assets: filenames contain a content hash, so cache for a year ----------------
    location /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;                   # a missing asset must be a 404, not index.html
      add_header Cache-Control "public, max-age=31536000, immutable";   # no "always": a 404 must not be cached
      add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- fonts: fixed file names that never change content, so long caching is safe ---------
    location /fonts/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- single-page app --------------------------------------------------------------------
    # CSP notes: the Vite build has no inline scripts; React sets inline style attributes, hence
    # 'unsafe-inline' for styles only. connect-src allows Cognito (AWS) for sign-in. Challenge
    # instances are opened as plain links, so no frame/connect rule is needed for them.
    # Add "Strict-Transport-Security" here once HTTPS is enabled.
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.amazonaws.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
  }
}
