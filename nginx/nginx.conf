# Placeholder. Shubham finalizes this in task P3-06.
events {}

http {
  include /etc/nginx/mime.types;

  server {
    listen 80;

    resolver 127.0.0.11 valid=10s;

    location /api {
      set $upstream http://backend:4000;
      proxy_pass $upstream;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
