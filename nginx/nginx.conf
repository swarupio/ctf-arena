# Mini CTF Arena - Nginx front door (P3-06).
#
# Does three jobs:
#   1. serves the built React app from /usr/share/nginx/html (compose mounts frontend/dist there),
#      with a single-page-app fallback to index.html;
#   2. load-balances /api/* across all backend replicas;
#   3. rate-limits and compresses.
#
# Validate without starting the stack:
#   docker run --rm -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t

user nginx;
worker_processes auto;
# /tmp is a tmpfs in docker-compose.yml (read-only root filesystem).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  # API bodies are tiny JSON (the backend itself caps them at 100 kb). Nobody uploads files here.
  client_max_body_size 128k;

  # The backend sets X-Served-By to its container hostname; the footer in the UI shows it.
  # It is also logged here as served_by=. Never add proxy_hide_header for it.
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time upstream=$upstream_addr served_by=$upstream_http_x_served_by';
  access_log /dev/stdout main buffer=16k flush=1s;

  # ---- compression -------------------------------------------------------------------------
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript application/javascript
             application/json application/xml image/svg+xml;

  # ---- rate limiting -----------------------------------------------------------------------
  # Per client IP, API only. Normal use is well below 1 request per second per player
  # (leaderboard poll every 10 s plus clicks), so 20 r/s with a burst of 60 never throttles
  # real users, even several players behind one campus NAT, but stops scripted floods.
  # Flag brute-forcing is limited separately by the backend (5 per minute per team per challenge).
  #
  # Trusted local sources are exempt so that load tests run from the VM or a laptop measure the
  # replicas, not this limiter. Real internet clients always arrive with a public address.
  # If you put a TLS proxy (Caddy, Certbot) in front of this container, every request will look
  # local, so also enable the real_ip lines in the server block below. See docs/SECURITY.md.
  geo $rate_limit_exempt {
    default       0;
    127.0.0.0/8   1;
    ::1           1;
    172.16.0.0/12 1;   # Docker bridge networks (host-to-container traffic appears from here)
  }
  map $rate_limit_exempt $api_limit_key {
    0 $binary_remote_addr;
    1 "";                 # an empty key is not counted
  }
  limit_req_zone $api_limit_key zone=api_per_ip:10m rate=20r/s;
  limit_req_status 429;
  limit_req_log_level warn;

  server {
    listen 80 default_server;
    server_name _;

    # Docker's embedded DNS. Because proxy_pass below uses a variable, Nginx re-resolves "backend"
    # at request time (cached for 10 s) and gets one A record per replica. That is what makes
    # `docker compose up -d --scale backend=5` work without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Uncomment when a TLS proxy runs in front of Nginx (see docs/SECURITY.md, HTTPS section):
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;

    # Liveness probe for Docker's healthcheck (does not touch the backend).
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ---- API: round-robin over the backend replicas ----------------------------------------
    location /api/ {
      limit_req zone=api_per_ip burst=60 nodelay;
      error_page 429 = @rate_limited;

      set $backend_upstream http://backend:4000;
      proxy_pass $backend_upstream;          # variable without a URI: the request path is passed unchanged

      proxy_http_version 1.1;
      proxy_set_header Connection close;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # We are the edge: overwrite, never append a client-supplied chain (it could be forged).
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      # If a replica is down or restarting, try another one. POST/PATCH are never retried
      # (the default), so a flag submission cannot be replayed by Nginx.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;

      # No add_header here on purpose: Helmet already sets security headers on API responses,
      # and X-Served-By passes through untouched.
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Slow down and try again."}}';
    }

    # ---- built assets: filenames contain a content hash, so cache for a year ----------------
    location /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;                   # a missing asset must be a 404, not index.html
      add_header Cache-Control "public, max-age=31536000, immutable";   # no "always": a 404 must not be cached
      add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- single-page app --------------------------------------------------------------------
    # CSP notes: the Vite build has no inline scripts; React sets inline style attributes, hence
    # 'unsafe-inline' for styles only. connect-src allows Cognito (AWS) for sign-in. Challenge
    # instances are opened as plain links, so no frame/connect rule is needed for them.
    # Add "Strict-Transport-Security" here once HTTPS is enabled.
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.amazonaws.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
  }
}
