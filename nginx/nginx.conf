# Nginx Load Balancer & Static File Server - CTF Arena
# Maintained by: Shubham (Phase 3 - Task P3-06)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format - captures replica response header
    log_format ctf_format '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" upstream: $upstream_addr '
                          'served_by: $upstream_http_x_served_by rt=$request_time';

    access_log /var/log/nginx/access.log ctf_format;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon;

    # Rate limiting for API requests (30 requests/second per IP with burst of 20)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Internal Docker DNS resolver for dynamic service discovery
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Standard error response matching CTF Arena JSON error spec
        error_page 429 /429.json;
        location = /429.json {
            internal;
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Rate limit exceeded. Please wait a moment."}}\n';
        }

        # API Proxy with round-robin load balancing across scaled backend replicas
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            # Using a variable in proxy_pass forces Nginx to re-resolve via Docker DNS
            # upon DNS TTL expiration, discovering newly scaled replicas (e.g. backend=5).
            set $upstream_backend http://backend:4000;
            proxy_pass $upstream_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure X-Served-By from backend replicas is passed down to client
            proxy_pass_header X-Served-By;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Static assets caching
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Single Page Application (SPA) routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
