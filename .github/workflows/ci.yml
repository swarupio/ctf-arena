# Pull request checks: same tests as the deploy pipeline, but never deploys.
name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
