# Reusable test workflow. ci.yml calls it for pushes to main, pull requests and manual runs. Vercel builds and deploys from Git on its own,
# so these tests are the gate to check before merging.
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    # The suite is CPU heavy (terminal fuzz and generator sweeps); about 3 minutes on 12 cores.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # backend/src/config/env.js validates every variable when it is imported and exits the process
    # when one is missing, so the runner needs values that pass validation. These are made-up CI
    # placeholders, not secrets: the tests mock MongoDB, Cognito and Docker and never connect to them.
    env:
      NODE_ENV: test
      PORT: '4000'
      MONGODB_URI: mongodb://localhost:27017/ctf_test
      COGNITO_REGION: us-east-1
      COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
      COGNITO_CLIENT_ID: testclientid12345678
      VITE_COGNITO_REGION: us-east-1
      VITE_COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
      VITE_COGNITO_CLIENT_ID: testclientid12345678
      PUBLIC_HOST: localhost
      FLAG_SECRET: ci-test-secret-at-least-32-characters-long
      CHALLENGE_PORT_MIN: '30000'
      CHALLENGE_PORT_MAX: '30100'
      INSTANCE_TTL_MINUTES: '30'
      MAX_INSTANCES_PER_TEAM: '2'
      CHALLENGE_MEMORY_MB: '128'
      CHALLENGE_CPU_LIMIT: '0.5'
      CHALLENGE_PIDS_LIMIT: '50'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # Includes the terminal, event, board, patch bay, interviews and lazy-route suites. The dot reporter keeps the log short.
      # --maxWorkers=3 matches a 4-vCPU runner (one core stays free for the vitest main process). Oversubscribed workers
      # starve each other and vitest then reports "Timeout calling onTaskUpdate". Per-test timeouts (60 s) are in vitest.config.js.
      - run: npm test -- --reporter=dot --maxWorkers=3

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # node --test runs every tests/*.test.js: event, hints, theme tokens/contrast/parity, board, patch bay, debrief.
      # CHECK_DEBRIEF_COMPLETE=1 also enforces that every flag has a debrief entry (skipped without it).
      - run: npm test
        env:
          CHECK_DEBRIEF_COMPLETE: '1'
      # Proves the production bundle compiles. Vercel builds the deployed bundle with the real
      # VITE_* values from the project's environment variables (see docs/DEPLOY_VERCEL.md).
      - run: npm run build
      # Prints the largest assets (also in the job summary) and fails above the budgets set in the script.
      - run: node ../deploy/bundle-size.mjs dist

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never blocks a merge: advisories appear and disappear without any change in this repo.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (production dependencies)
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev
