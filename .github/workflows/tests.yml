# Reusable test workflow. ci.yml (pull requests) and deploy.yml (push to main) both call it,
# so a PR and a deploy are always judged by exactly the same checks.
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # backend/src/config/env.js validates every variable when it is imported and exits the process
    # when one is missing, so the runner needs values that pass validation. These are made-up CI
    # placeholders, not secrets: the tests mock MongoDB, Cognito and Docker and never connect to them.
    env:
      NODE_ENV: test
      PORT: '4000'
      MONGODB_URI: mongodb://localhost:27017/ctf_test
      COGNITO_REGION: us-east-1
      COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
      COGNITO_CLIENT_ID: testclientid12345678
      VITE_COGNITO_REGION: us-east-1
      VITE_COGNITO_USER_POOL_ID: us-east-1_TESTPOOL
      VITE_COGNITO_CLIENT_ID: testclientid12345678
      PUBLIC_HOST: localhost
      FLAG_SECRET: ci-test-secret-at-least-32-characters-long
      CHALLENGE_PORT_MIN: '30000'
      CHALLENGE_PORT_MAX: '30100'
      INSTANCE_TTL_MINUTES: '30'
      MAX_INSTANCES_PER_TEAM: '2'
      CHALLENGE_MEMORY_MB: '128'
      CHALLENGE_CPU_LIMIT: '0.5'
      CHALLENGE_PIDS_LIMIT: '50'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # Proves the production bundle compiles. The deployed bundle is built on the VM with the real
      # VITE_* values from its .env (see deploy/deploy.sh).
      - run: npm run build
